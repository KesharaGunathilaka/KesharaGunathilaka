.sig{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:18 120;stroke-dashoffset:18;opacity:0}
.halo{opacity:.14}
@keyframes cycle{0%{opacity:0;transform:translateY(8px)}3.2%{opacity:1;transform:translateY(0)}16.8%{opacity:1;transform:translateY(0)}20%{opacity:0;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-8px)}}
@keyframes flow{0%{stroke-dashoffset:18;opacity:0}4%{opacity:1}24%{opacity:1}28%{stroke-dashoffset:-100;opacity:0}100%{stroke-dashoffset:-100;opacity:0}}
@keyframes pulse{0%,100%{opacity:.10}50%{opacity:.34}}
@keyframes driftA{0%,100%{transform:translate(0,0)}50%{transform:translate(-46px,26px)}}
@keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(52px,-22px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}
@media (prefers-reduced-motion:no-preference){
.role{animation:cycle 15s infinite}
.r2{animation-delay:3s}.r3{animation-delay:6s}.r4{animation-delay:9s}.r5{animation-delay:12s}
.sig{animation:flow 4.6s linear infinite}
.halo{animation:pulse 3s ease-in-out infinite}
.ga{animation:driftA 14s ease-in-out infinite}
.gb{animation:driftB 17s ease-in-out infinite}
.prompt{animation:blink 1.2s steps(1) infinite}
}
</style>
