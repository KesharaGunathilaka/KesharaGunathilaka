name: Update profile cards

# Regenerates the images in profile/ (stats, top languages, contribution snake)
# and commits them to this repository, so the README never depends on a
# third-party image service being online.
#
# Each image is a single file that reads well on both light and dark GitHub
# themes: the cards carry their own background, and the snake uses
# semi-transparent colours. This avoids <picture> theme switching, which
# follows the visitor's system setting rather than their GitHub theme.

on:
  schedule:
    - cron: "17 2 * * *" # once a day, 02:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

env:
  STATS: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide=stars,issues&show=prs_merged&include_all_commits=true&line_height=24
  LANGS: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=plpgsql,cmake,css,html,shell,dockerfile,makefile
  CARD: disable_animations=true&hide_border=false&border_color=334155&border_radius=12&bg_color=135,0b1020,0f1a38,0a2b36&title_color=67e8f9&text_color=e2e8f0&icon_color=a78bfa

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.STATS }}&${{ env.CARD }}
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.LANGS }}&${{ env.CARD }}
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_dots=#8b949e33,#2ea04366,#2ea04399,#2ea043cc,#2ea043

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
