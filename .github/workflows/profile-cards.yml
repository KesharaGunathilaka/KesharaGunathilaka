name: Update profile cards

# Regenerates the images in profile/ (stats, top languages, contribution snake)
# and commits them to this repository, so the README never depends on a
# third-party image service being online.

on:
  schedule:
    - cron: "17 2 * * *" # once a day, 02:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

env:
  STATS: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide=stars,issues&show=prs_merged&include_all_commits=true&hide_border=true&bg_color=00000000
  LANGS: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=plpgsql,cmake,css,html,shell,dockerfile,makefile&hide_border=true&bg_color=00000000
  LIGHT: title_color=0969da&text_color=1f2328&icon_color=0969da
  DARK: title_color=58a6ff&text_color=e6edf3&icon_color=58a6ff

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.STATS }}&${{ env.LIGHT }}
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.STATS }}&${{ env.DARK }}
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.LANGS }}&${{ env.LIGHT }}
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.LANGS }}&${{ env.DARK }}
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
